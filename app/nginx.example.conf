# Example nginx config for CatalogHQ frontend (app/dist).
# Reload-safe SPA routing: unknown paths fall back to index.html.

server {
    listen 80;
    server_name cataloghq.store www.cataloghq.store;

    root /var/www/cataloghq/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://res.cloudinary.com; connect-src 'self' https://api.flutterwave.com https://api.cataloghq.store; frame-src https://checkout.flutterwave.com https://checkout.paystack.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
