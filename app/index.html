<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/images/cataloghq-logos/cataloghq-full-logo-no-bg_3_360x360.png"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>CatalogHQ | Sell online with one link | Nigerian vendors</title>
    <meta
      name="description"
      content="CatalogHQ gives Nigerian vendors a professional storefront, Flutterwave checkout, and one shareable link. Set up in 60 seconds. From ₦3,000/month."
    />
    <!-- Open Graph / X (Twitter) link previews. Crawlers read this HTML, not the React app -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CatalogHQ" />
    <meta property="og:title" content="CatalogHQ | Sell online with one link | Nigerian vendors" />
    <meta
      property="og:description"
      content="CatalogHQ gives Nigerian vendors a professional storefront, Flutterwave checkout, and one shareable link. Set up in 60 seconds. From ₦3,000/month."
    />
    <meta property="og:url" content="__CATALOGHQ_SITE_URL__/" />
    <!-- Option B: 2:1 banner for Facebook, WhatsApp, LinkedIn -->
    <meta
      property="og:image"
      content="__CATALOGHQ_SITE_URL__/images/cataloghq-logos/cataloghq-social-og-1200x630.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CatalogHQ. One link with paid checkout for Nigerian vendors." />
    <meta property="og:image:type" content="image/png" />
    <!-- Option A: square logo + summary card for X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CatalogHQ | Sell online with one link | Nigerian vendors" />
    <meta
      name="twitter:description"
      content="CatalogHQ gives Nigerian vendors a professional storefront, Flutterwave checkout, and one shareable link. Set up in 60 seconds. From ₦3,000/month."
    />
    <meta
      name="twitter:image"
      content="__CATALOGHQ_SITE_URL__/images/cataloghq-logos/cataloghq-full-logo-no-bg_4_480x480.png"
    />
    <meta name="twitter:image:alt" content="CatalogHQ logo" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/hero-feed-slide-1.webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
